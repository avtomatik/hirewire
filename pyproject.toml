[project]
name = "hirewire"
version = "0.1.0"
description = "A personal job-search tracker and intelligence system."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-api-python-client>=2.200.0",
    "google-auth>=2.58.0",
    "google-auth-oauthlib>=1.5.0",
    "pydantic-settings>=2.16.2",
    "typer>=0.28.0",
]

[project.scripts]
hirewire = "hirewire.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hirewire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

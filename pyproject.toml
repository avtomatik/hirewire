[project]
name = "hirewire"
version = "0.2.0"
description = "Personal job-search intelligence: Google Workspace, archived HeadHunter API, account imports, Telegram exports."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-api-python-client>=2.202.0",
    "google-auth>=2.62.2",
    "google-auth-oauthlib>=1.5.0",
    "pydantic-settings>=2.16.3",
    "requests>=2.34.2",
    "typer>=0.29.2",
]

[project.scripts]
hirewire = "hirewire.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hirewire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
